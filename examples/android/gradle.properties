# captcha-pro android gradle properties
android.useAndroidX=true

# Matches examples/flutter/android/gradle.properties (Flutter 3.44.9 template).
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Unlike examples/flutter/android, android.newDsl / android.builtInKotlin are
# intentionally left unset. Those flags exist because the Flutter Gradle plugin
# does not support AGP 9's new DSL yet; this module is plain Android, so it
# uses AGP 9's built-in Kotlin on the new DSL instead. The opt-out is scheduled
# for removal in AGP 10 — copying it here would lock in the deprecated path.
